services:
  - type: web
    name: scanme-backend
    env: node
    region: singapore   # Closest to Bengaluru
    plan: free          # Upgrade to starter ($7/mo) for always-on
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scanme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_PLACES_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: scanme-db
    databaseName: scanme_db
    plan: free
    region: singapore
